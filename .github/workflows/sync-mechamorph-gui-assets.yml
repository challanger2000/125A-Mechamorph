name: Sync Mechamorph GUI Assets

on:
  push:
    branches:
      - v0.1.0
    paths:
      - '.github/workflows/sync-mechamorph-gui-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0

      - name: Fetch approved Knob Designer assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/challanger2000/125A-Knob-Designer/v0.2.0/generated-assets/mechamorph-v0.1.0"
          rm -rf resource/mechamorph-controls
          mkdir -p resource/mechamorph-controls

          declare -A files=(
            [main.png]=main_170px_96f_scale-1x.png
            [main#1.2529411764705882x.png]=main_213px_96f_scale-1p25x.png
            [main#1.5x.png]=main_255px_96f_scale-1p5x.png
            [main#2x.png]=main_340px_96f_scale-2x.png

            [scale.png]=scale_220px_72f_scale-1x.png
            [scale#1.25x.png]=scale_275px_72f_scale-1p25x.png
            [scale#1.5x.png]=scale_330px_72f_scale-1p5x.png
            [scale#2x.png]=scale_440px_72f_scale-2x.png

            [utility.png]=utility_104px_128f_scale-1x.png
            [utility#1.25x.png]=utility_130px_128f_scale-1p25x.png
            [utility#1.5x.png]=utility_156px_128f_scale-1p5x.png
            [utility#2x.png]=utility_208px_128f_scale-2x.png

            [machine.png]=machine_250px_6f_scale-1x.png
            [machine#1.252x.png]=machine_313px_6f_scale-1p25x.png
            [machine#1.5x.png]=machine_375px_6f_scale-1p5x.png
            [machine#2x.png]=machine_500px_6f_scale-2x.png
          )

          for dst in "${!files[@]}"; do
            src="${files[$dst]}"
            curl --fail --location --retry 3 "$base/$src" -o "resource/mechamorph-controls/$dst"
            test -s "resource/mechamorph-controls/$dst"
          done
          curl --fail --location --retry 3 "$base/manifest.json" -o resource/mechamorph-controls/manifest.json

      - name: Verify normalized multires PNGs
        shell: python
        run: |
          import json, struct
          from pathlib import Path
          root=Path("resource/mechamorph-controls")
          m=json.loads((root/"manifest.json").read_text())

          expect={
            "main":(96,[(1.0,"main.png",170),(213/170,"main#1.2529411764705882x.png",213),(1.5,"main#1.5x.png",255),(2.0,"main#2x.png",340)]),
            "scale":(72,[(1.0,"scale.png",220),(1.25,"scale#1.25x.png",275),(1.5,"scale#1.5x.png",330),(2.0,"scale#2x.png",440)]),
            "utility":(128,[(1.0,"utility.png",104),(1.25,"utility#1.25x.png",130),(1.5,"utility#1.5x.png",156),(2.0,"utility#2x.png",208)]),
            "machine":(6,[(1.0,"machine.png",250),(313/250,"machine#1.252x.png",313),(1.5,"machine#1.5x.png",375),(2.0,"machine#2x.png",500)]),
          }
          for key,(frames,variants) in expect.items():
            assert m["controls"][key]["frameCount"]==frames
            for factor,name,width in variants:
              p=root/name
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n"
              w,h=struct.unpack(">II",data[16:24])
              assert w==width,(name,w,width)
              assert h==width*frames,(name,h,width*frames)
          assert len(list(root.glob("*.png")))==16
          print("Mechamorph normalized VSTGUI multires assets PASS")

      - name: Commit approved assets
        shell: bash
        run: |
          git config user.name "125A GUI Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A resource/mechamorph-controls
          if git diff --cached --quiet; then
            echo "GUI assets unchanged."
            exit 0
          fi
          git commit -m "Normalize Mechamorph VSTGUI multires assets [skip ci]"
          git push origin HEAD:v0.1.0
