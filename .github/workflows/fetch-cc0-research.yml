name: Fetch CC0 Machine Research Audio

on:
  workflow_dispatch:

jobs:
  fetch-cc0:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public CC0 machine sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-fetch/mp3 research-fetch/wav

          declare -A files=(
            [manual_winch_0902]="https://bigsoundbank.com/UPLOAD/mp3/0902.mp3"
            [large_ratchet_0795]="https://bigsoundbank.com/UPLOAD/mp3/0795.mp3"
            [sewing_slow_1115]="https://bigsoundbank.com/UPLOAD/mp3/1115.mp3"
            [sewing_fast_1116]="https://bigsoundbank.com/UPLOAD/mp3/1116.mp3"
            [large_spring_0206]="https://bigsoundbank.com/UPLOAD/mp3/0206.mp3"
            [medium_chain_0619]="https://bigsoundbank.com/UPLOAD/mp3/0619.mp3"
            [air_burst_0138]="https://bigsoundbank.com/UPLOAD/mp3/0138.mp3"
            [ratchet_rattle_0923]="https://bigsoundbank.com/UPLOAD/mp3/0923.mp3"
            [roller_shutter_2469]="https://bigsoundbank.com/UPLOAD/mp3/2469.mp3"
            [stapler_0009]="https://bigsoundbank.com/UPLOAD/mp3/0009.mp3"
          )

          for name in "${!files[@]}"; do
            url="${files[$name]}"
            echo "Fetching $name from $url"
            curl --fail --location --retry 2 --connect-timeout 20 \
              "$url" -o "research-fetch/mp3/$name.mp3"
            test -s "research-fetch/mp3/$name.mp3"
            file "research-fetch/mp3/$name.mp3"
          done

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Convert to analysis WAV
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          for src in research-fetch/mp3/*.mp3; do
            name="$(basename "$src" .mp3)"
            ffmpeg -hide_banner -loglevel error -y -i "$src" \
              -ac 1 -ar 48000 -c:a pcm_s24le "research-fetch/wav/$name.wav"
          done
          ls -lh research-fetch/wav

      - name: Write provenance
        shell: bash
        run: |
          cat > research-fetch/PROVENANCE.txt <<'EOF'
          BigSoundBank / La Sonothèque CC0 machine research pack 02.
          Each selected source page identifies the file as CC0/public-domain equivalent
          and permits editing, commercial use, and redistribution.

          manual_winch_0902
          Page: https://bigsoundbank.com/manual-winch-2-s0902.html

          large_ratchet_0795
          Page: https://bigsoundbank.com/large-ratchet-s0795.html

          sewing_slow_1115
          Page: https://bigsoundbank.com/sewing-machine-slow-speed-s1115.html

          sewing_fast_1116
          Page: https://bigsoundbank.com/sewing-machine-fast-speed-s1116.html

          large_spring_0206
          Page: https://bigsoundbank.com/large-spring-s0206.html

          medium_chain_0619
          Page: https://bigsoundbank.com/medium-chain-s0619.html

          air_burst_0138
          Page: https://bigsoundbank.com/air-s0138.html

          ratchet_rattle_0923
          Page: https://bigsoundbank.com/rattle-s0923.html

          roller_shutter_2469
          Page: https://bigsoundbank.com/manual-roller-shutter-opening-int--s2469.html

          stapler_0009
          Page: https://bigsoundbank.com/stapler-s0009.html

          Research conversion: mono 48 kHz / 24-bit PCM WAV.
          Original MP3 downloads are retained in the artifact.
          EOF
          sha256sum research-fetch/mp3/* research-fetch/wav/* > research-fetch/SHA256SUMS.txt

      - name: Upload research pack
        uses: actions/upload-artifact@v4
        with:
          name: Mechamorph-CC0-Machine-Research-Pack-02
          path: research-fetch/
          if-no-files-found: error
          retention-days: 7
